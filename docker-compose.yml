services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swastha-setu
    image: swastha-setu:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/facilities || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
